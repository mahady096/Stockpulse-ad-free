<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#667eea">
<title>StockPulse Pro</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#0f172a;background:#f8fafc}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}
.card{width:min(560px,100%);background:#fff;border:1px solid #e2e8f0;border-radius:22px;padding:28px;box-shadow:0 18px 50px rgba(15,23,42,.10)}
.crown{font-size:48px;text-align:center}.title{text-align:center;margin:8px 0;font-size:28px}.sub{text-align:center;color:#64748b;margin:0 0 22px}
.price{text-align:center;font-size:30px;font-weight:800;margin:18px 0}.price small{font-size:14px;font-weight:500;color:#64748b}
ul{list-style:none;padding:0;margin:20px 0}li{padding:10px 0;border-bottom:1px solid #f1f5f9}.buy{display:block;width:100%;border:0;border-radius:12px;padding:14px 18px;background:#4f46e5;color:#fff;font-size:16px;font-weight:800;cursor:pointer}.back{display:block;text-align:center;margin-top:14px;color:#64748b;text-decoration:none;font-size:14px}
</style>
</head>
<body>
<div class="card">
<div class="crown">👑</div><h1 class="title">StockPulse Pro</h1>
<p class="sub">Unlock advanced tools and remove ads.</p>
<div class="price">৳50 <small>/ month</small></div>
<ul><li>✅ Advanced Charts</li><li>✅ Smart Signals</li><li>✅ Deep Analysis</li><li>✅ Advanced technical indicators & forecasts</li><li>✅ No Ads</li><li>✅ Unlimited portfolios</li><li>✅ Unlimited active shares</li></ul>
<button class="buy" id="buy">📧 BUY NOW</button>
<a class="back" href="./">← Back to Dashboard</a>
</div>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
(function(){
  const ADMIN_EMAIL='admin@gmail.com';
  const btn=document.getElementById('buy');
  btn.addEventListener('click',function(){
    const user=window.auth&&window.auth.currentUser;
    const email=user?.email||''; const uid=user?.uid||'';
    const subject='stock pulse pro';
    const body='আমি StockPulse Pro কিনতে চাই.\n\nEmail: '+email+'\nUID: '+uid+'\n\nদয়া করে পেমেন্টের নির্দেশনা দিন।';
    window.location.href='mailto:'+ADMIN_EMAIL+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
  });
})();
</script>
</body></html>
